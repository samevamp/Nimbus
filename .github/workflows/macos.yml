name: Build macOS Universal

on:
  push:
    branches: [master, nimbus-minibar]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash ./macos/build.sh
      - name: Verify architectures
        run: |
          lipo -archs build/macos/Nimbus.app/Contents/MacOS/Nimbus
          lipo -archs build/macos/Nimbus.app/Contents/Resources/Payload/bin/utunws
      - uses: actions/upload-artifact@v4
        with:
          name: Nimbus-macOS-universal
          path: dist/Nimbus-macOS-universal.zip
          if-no-files-found: error
